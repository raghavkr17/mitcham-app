name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Points the deployed site at the real API instead of the mock
      # persona-picker demo. Set the MITCHAM_API_BASE repo/environment
      # variable (Settings -> Secrets and variables -> Actions -> Variables)
      # to your deployed API's URL (e.g. https://mitcham-api.onrender.com).
      # Left unset, the site falls back to the local mock demo.
      - name: Write frontend/config.js
        if: ${{ vars.MITCHAM_API_BASE != '' }}
        run: echo "window.MITCHAM_API_BASE = \"${{ vars.MITCHAM_API_BASE }}\";" > frontend/config.js

      - name: Upload frontend/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
